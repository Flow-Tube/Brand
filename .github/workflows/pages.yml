name: pages

# Publishes v1/ and the gallery to GitHub Pages (https://assets.flow-tube.org).
on:
  push:
    branches: [main]
    paths: ["v1/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main   # a dispatch from build.yml or stats.yml must see the commit it just pushed

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -R v1 _site/v1
          cp site/index.html _site/index.html
          echo assets.flow-tube.org > _site/CNAME
          touch _site/.nojekyll
          find _site -maxdepth 2 | sort | head -20

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
