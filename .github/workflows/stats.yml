name: stats

# Refreshes the release and download chips (Android and Desktop) from the GitHub releases API,
# and the star history charts in v1/stars/ from the stargazers API.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [flow-release]

permissions:
  contents: write   # commit the refreshed chips
  actions: write    # start pages.yml after that commit

concurrency:
  group: write-main
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install pinned dependencies and build the font
        run: sh tools/setup.sh

      - name: Update release and download chips
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/update_stats.py

      - name: Update star history charts
        env:
          # GitHub only lists stargazers to a repo's admins and collaborators, so the built-in token can't.
          # One fine-grained token per owner, each limited to that owner's repo (Metadata: read).
          STARS_TOKEN_A_EDEV: ${{ secrets.STARS_TOKEN_A_EDEV }}
          STARS_TOKEN_FLOW_TUBE: ${{ secrets.STARS_TOKEN_FLOW_TUBE }}
        run: |
          if [ -z "$STARS_TOKEN_A_EDEV" ] || [ -z "$STARS_TOKEN_FLOW_TUBE" ]; then
            echo "::warning::STARS_TOKEN_A_EDEV or STARS_TOKEN_FLOW_TUBE is not set; skipping the star history charts"
            exit 0
          fi
          python tools/flowstars.py
          python tools/make_manifest.py

      - name: Check assets
        run: python tools/check_assets.py --base HEAD

      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # porcelain also lists untracked files, so the first run's new charts and caches count
          if [ -z "$(git status --porcelain -- v1 tools/data)" ]; then
            echo "Chips and star history unchanged"
            exit 0
          fi
          git status --short -- v1 tools/data
          git add v1 tools/badges.json tools/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stats): update chips and star history"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
