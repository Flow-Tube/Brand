name: build

# Regenerates v1/ from tools/ and enforces the URL contract.
# PRs: check, then upload v1/ as an artifact for review. main: check, then commit v1/ if it changed.
on:
  push:
    branches: [main]
    paths: ["tools/**", "v1/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["tools/**", "v1/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write   # commit regenerated assets on main
  actions: write    # start pages.yml after that commit

concurrency:
  # every job that commits to main shares one queue; PRs get their own
  group: ${{ github.event_name == 'pull_request' && format('build-{0}', github.ref) || 'write-main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install pinned dependencies and build the font
        run: sh tools/setup.sh

      - name: Find the base commit for the URL contract
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base=$BEFORE
          else
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "URL contract base: $base"

      # A hand-deleted file would be quietly recreated by the generators below, so check the tree as committed first.
      - name: URL contract (as committed)
        run: python tools/check_assets.py --base ${{ steps.base.outputs.sha }} --contract-only

      - name: Regenerate
        run: |
          python tools/flowbadges.py
          python tools/flowbanners.py
          python tools/flowicons.py --previews-only
          python tools/make_manifest.py

      - name: Check assets
        run: python tools/check_assets.py --base ${{ steps.base.outputs.sha }}

      - name: Show what changed
        run: git status --short v1 | head -50

      - name: Upload v1/ for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v1-pr${{ github.event.number }}
          path: v1/

      - name: Commit regenerated assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add v1
          if git diff --cached --quiet; then
            echo "v1/ is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(assets): regenerate"
          git push origin HEAD:main
          # pushes made with GITHUB_TOKEN don't trigger workflows, so deploy explicitly
          gh workflow run pages.yml --ref main
